function modelTable(rows){return `<div class="table-wrap"><table class="model-table"><thead><tr><th class="check-col"><span class="sr-only">Compare</span></th><th>Model <span style="margin-left:5px;color:#bac3af">↕</span></th><th>Category</th><th>Parameters</th><th>Context</th><th>Access</th><th><span class="sr-only">Save</span></th></tr></thead><tbody>${rows.map(m=>`<tr><td class="check-col"><input type="checkbox" data-compare="${esc(m.id)}" aria-label="Compare ${esc(m.name)}" ${state.compare.includes(m.id)?'checked':''}></td><td><button class="model-name" data-open="${esc(m.id)}">${orgIcon(m)}<span><strong>${esc(m.name)}</strong><small>${esc(m.org)} · ${m.year||'Year not indexed'}</small></span></button></td><td>${typePill(m)}</td><td class="numeric">${paramLabel(m)}${m.active?`<small class="cell-sub">${formatParams(m.active)} active</small>`:''}</td><td class="numeric" title="${m.ctx?m.ctx.toLocaleString()+' tokens':'Not applicable or not indexed'}">${formatContext(m.ctx)}${m.ctx?'<small class="cell-sub">tokens</small>':''}</td><td><span class="access-tag ${m.access==='API only'?'closed':''}"><i class="dot"></i>${esc(m.access)}</span></td><td>${saveButton(m)}</td></tr>`).join('')}</tbody></table></div>`;}
function modelCard(m){return `<article class="model-card"><div class="model-card-top">${orgIcon(m)}${saveButton(m)}</div><button class="model-open" data-open="${esc(m.id)}"><h3>${esc(m.name)}</h3></button><p>${esc(m.org)} · ${m.year||'Year not indexed'}</p><div class="card-stats"><div><small>PARAMETERS</small><strong>${paramLabel(m)}</strong></div><div><small>CONTEXT</small><strong>${formatContext(m.ctx)}${m.ctx?' tokens':''}</strong></div></div><div class="card-actions">${typePill(m)}<button class="btn ${state.compare.includes(m.id)?'active':''}" data-compare="${esc(m.id)}">${icon(state.compare.includes(m.id)?'check':'compare')}${state.compare.includes(m.id)?'Selected':'Compare'}</button></div></article>`;}
function empty(title,desc,label,action){return `<div class="empty">${icon('compass')}<h3>${title}</h3><p>${desc}</p>${label?`<button class="btn" ${action==='clear'?'id="clear-filters"':`data-page="${action}"`}>${label}${icon('arrow')}</button>`:''}</div>`;}
function clearFilters(){state.q='';state.kind='All models';state.org='';state.access='';state.size='';state.pageNum=1;renderCatalog();if(state.dataset==='live'&&state.page==='explore')loadLive(false);}
function toggleSave(id){const m=resolve(id);if(!m)return;if(state.saved.includes(id)){state.saved=state.saved.filter(x=>x!==id);toast('Removed from saved models.');}else{state.saved.push(id);if(m.live&&!state.liveCache.some(x=>x.id===id))state.liveCache.push(m);toast('Saved to your collection.');}persist();updateCounts();$$('[data-save]').forEach(b=>{const saved=state.saved.includes(b.dataset.save);b.classList.toggle('saved',saved);b.setAttribute('aria-pressed',String(saved));b.setAttribute('aria-label',`${saved?'Unsave':'Save'} ${resolve(b.dataset.save)?.name||'model'}`);});if(state.page==='saved')renderResults();}

function renderCompare(){const selected=state.compare.map(resolve).filter(Boolean);$('#main').innerHTML=pageIntro('SIDE BY SIDE','Find your fit.','Compare up to four models. A larger parameter count does not automatically mean better performance for your task.')+(selected.length?`<div class="section-head"><span>${selected.length} of 4 selected</span><button class="btn" data-page="explore">${icon('compass')}Add models</button></div><div class="panel compare-scroll" style="padding:0"><table class="compare-table"><thead><tr><th>MODEL</th>${selected.map(m=>`<td><button class="icon-btn" data-compare="${esc(m.id)}" aria-label="Remove ${esc(m.name)}">${icon('close')}</button>${orgIcon(m)}<h3>${esc(m.name)}</h3><small>${esc(m.org)}</small></td>`).join('')}</tr></thead><tbody>${[['Category',m=>typePill(m)],['Total parameters',m=>paramLabel(m)],['Active per token',m=>m.active?formatParams(m.active):m.p&&m.arch!=='Undisclosed'?'Not separately reported':'Undisclosed'],['Context',m=>m.ctx?m.ctx.toLocaleString()+' tokens':'Not applicable / indexed'],['Architecture',m=>esc(m.arch)],['Access',m=>esc(m.access)],['License',m=>esc(m.license)],['Published year',m=>m.year||'Not indexed'],['4-bit weight estimate',m=>m.p?weightMemory(m.p,4).toFixed(1)+' GiB<small>Ideal weight storage only; extra memory required.</small>':'Unavailable'],['Benchmark results',m=>m.bench?.map(b=>`<strong>${b.score}%</strong> ${esc(b.name)}<small>${esc(b.protocol)}</small>`).join('<br>')||'Not indexed'],['Notes',m=>esc(m.note||'Consult the source for configuration and limitations.')],['Source',m=>`<a class="btn" href="${esc(safeURL(m.source))}" target="_blank" rel="noopener noreferrer">Model card ${icon('external')}</a>`]].map(([label,fn])=>`<tr><th>${label}</th>${selected.map(m=>`<td>${fn(m)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">Parameter counts are approximate publisher specifications. Diffusion counts may cover only the backbone. Benchmark percentages are only comparable when the dataset, protocol, and evaluation settings match.</div>`:empty('Make room for a little perspective.','Select the comparison checkbox on any model in the directory, then add up to three more.','Explore models','explore'));}
function renderBenchmarks(){const metrics=[...new Set(models.flatMap(m=>m.bench?.map(b=>b.name)||[]))];const entries=models.flatMap(m=>(m.bench||[]).filter(b=>b.name===state.benchmark).map(b=>({m,...b})));const groups=[...new Set(entries.map(e=>e.protocol))];$('#main').innerHTML=pageIntro('EVIDENCE, WITH CONTEXT','Numbers need a method.','A small, sourced benchmark collection. Results are grouped by the publisher’s evaluation protocol, so unlike tests never become one leaderboard.')+`<div class="benchmark-tabs">${metrics.map(n=>`<button class="btn ${state.benchmark===n?'active':''}" data-benchmark="${esc(n)}">${esc(n)}</button>`).join('')}</div><div class="panel"><div class="section-head"><h2>${esc(state.benchmark)}</h2><span>Reported score · % · higher is better</span></div>${groups.map(g=>`<section class="benchmark-group"><h3>${esc(g)}</h3>${entries.filter(e=>e.protocol===g).sort((a,b)=>b.score-a.score).map(e=>`<div class="benchmark-row"><button data-open="${esc(e.m.id)}">${esc(e.m.name)}</button><div class="bar-bg"><div class="bar-fill" style="width:${e.score}%"></div></div><span class="numeric">${e.score.toFixed(1)}</span></div>`).join('')}<a class="bench-source" href="${esc(safeURL(entries.find(e=>e.protocol===g).m.benchSource||entries.find(e=>e.protocol===g).m.source))}" target="_blank" rel="noopener noreferrer">View the publisher's evaluation and settings ↗</a></section>`).join('')}</div><div class="notice">These are publisher-reported results, not independent reruns. Missing scores mean “not indexed,” not zero. MMLU, MMLU-Pro, GPQA Diamond and HumanEval measure different capabilities. Harnesses, prompting, sampling and reasoning budgets affect the result.</div>`;}
function renderInference(){const eligible=models.filter(m=>m.p&&m.access==='Open weights');$('#main').innerHTML=pageIntro('FROM SPECIFICATIONS TO INFERENCE','Could you run it?','Estimate weight storage for local inference, then look up hosted providers. Actual GPU memory needs also depend on your context, batch size, quantization, and runtime.')+`<div class="two-col"><section class="panel"><h2>Local memory estimator</h2><p>A transparent starting point for hardware planning.</p><label class="field-label" for="est-model">MODEL</label><select id="est-model" class="wide-select">${eligible.map(m=>option(m.id,m.name+' · '+formatParams(m.p),state.estModel)).join('')}</select><label class="field-label" for="precision">WEIGHT PRECISION</label><select id="precision" class="wide-select">${[[4,'4-bit · quantized'],[8,'8-bit · quantized'],[16,'16-bit · FP16 / BF16'],[32,'32-bit · FP32']].map(([v,l])=>option(String(v),l,String(state.bits))).join('')}</select><label class="field-label" for="gpu">AVAILABLE GPU MEMORY (GiB)</label><input id="gpu" class="number-input" type="number" min="1" max="100000" step="1" value="${state.gpu}"><div class="notice">Formula: total parameters × bits ÷ 8 ÷ 2³⁰. MoE models use total stored parameters, not only active parameters. This assumes ideal packing and excludes quantization metadata.</div></section><section class="panel"><div class="section-head"><h2>Weight storage</h2>${icon('chip')}</div><div id="estimate-result"></div></section></div><section class="panel"><h2>Hosted inference, without the guesswork.</h2><p>Open any model’s details and choose “Check live providers” to retrieve available services, token prices, throughput, and first-token latency where Hugging Face publishes them. Inference runs on the selected external service; this explorer does not execute models.</p><button class="btn" data-open="${esc(state.estModel)}" id="inference-detail" style="margin-top:18px">View selected model ${icon('arrow')}</button></section>`;$('#est-model').onchange=e=>{state.estModel=e.target.value;updateEstimate();$('#inference-detail').dataset.open=state.estModel;};$('#precision').onchange=e=>{state.bits=Number(e.target.value);updateEstimate();};$('#gpu').oninput=e=>{state.gpu=Number(e.target.value);updateEstimate();};updateEstimate();}
function updateEstimate(){const m=resolve(state.estModel),gib=weightMemory(m.p,state.bits),valid=Number.isFinite(state.gpu)&&state.gpu>=1&&state.gpu<=100000,percent=valid?gib/state.gpu*100:0;$('#estimate-result').innerHTML=`<div class="est-result">${gib.toFixed(1)}<small>GiB</small></div><div class="estimate-label">Ideal ${state.bits}-bit weights · ${esc(m.name)}</div><div class="memory-track"><span class="${percent>100?'over':''}" style="width:${Math.min(100,percent)}%"></span></div><p>${!valid?'Enter GPU memory between 1 and 100,000 GiB.':percent>100?`Weights alone exceed ${state.gpu} GiB. Multiple devices or offloading would be needed.`:`Weights alone use ${percent.toFixed(0)}% of ${state.gpu} GiB. This is not a guarantee the model will run.`}</p><div class="notice"><strong>Leave room for the rest.</strong><br>KV cache, activations, temporary buffers and the runtime add memory. Long contexts and larger batches can add substantially more. Image, audio and video pipelines may load extra encoders and decoders. Supported precision depends on the model and runtime.</div><button class="btn" data-open="${esc(m.id)}" style="margin-top:20px">Model specifications ${icon('arrow')}</button>`;}
function renderAbout(){$('#main').innerHTML=pageIntro('HOW THE INDEX WORKS','Useful data. Honest boundaries.','Model Atlas connects model specifications to their sources. It is a research starting point, not a claim to catalog every AI model ever created.')+`<div class="about-grid">${[['Scope of the catalog',`The curated index contains ${models.length} representative checkpoints across ${kinds.length-1} categories. It includes historical and contemporary models, but not every private, unpublished, fine-tuned or retired model. Live Hub search expands discovery to public Hugging Face repositories.`],['Parameters & context','B means billion and M means million parameters. Counts use published nominal sizes and can be rounded. MoE total and active counts are shown separately. Some image/video counts cover only the backbone. Context displays compact token limits; details explain extensions and input-only limits.'],['Benchmark methodology','Only selected results with an identified publisher and protocol are indexed. We do not average unrelated benchmarks into a universal score. Scores from different harnesses, prompts or reasoning budgets must not be treated as a controlled comparison.'],['Inference metrics','Provider prices, output tokens per second and first-token latency are fetched on demand from the Hugging Face router. Missing metrics stay blank. Probe results are workload-dependent observations, not speed or availability guarantees.'],['Freshness & provenance',`Curated specifications were assembled on ${checked}. They are not updated automatically. Each entry links to its publisher’s model card or documentation; check that source for changes. Live results show the retrieval time. Repository creation year is not necessarily a model’s original release year.`],['Your data & external requests','Bookmarks are stored in this browser and are not synced across devices. Live search sends the search query to Hugging Face. Provider lookups send a model ID to its router. No inference prompts, credentials or API keys are collected by this site. External providers may require their own account.']].map(([h,p])=>`<section class="panel"><h3>${h}</h3><p>${p}</p></section>`).join('')}</div><section class="panel sources-block"><h2>Follow the sources</h2><div class="source-list">${[['Hugging Face — model and provider APIs','https://huggingface.co/docs/inference-providers/hub-api'],['Meta — Llama 3.3 model card & evaluation protocol','https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct'],['DeepSeek — R1 model card & evaluation settings','https://huggingface.co/deepseek-ai/DeepSeek-R1'],['OpenAI — gpt-oss architecture and parameter counts','https://deploymentsafety.openai.com/gpt-oss/architecture'],['Google — Gemini 3.1 Pro model documentation','https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview'],['Anthropic — Claude Opus 4.6 release documentation','https://www.anthropic.com/news/claude-opus-4-6']].map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${l}${icon('external')}</a>`).join('')}</div></section><div class="notice">“Open weights” describes weight availability, not an unrestricted open-source license. Some repositories are gated or have usage restrictions. Review each model’s current license and use policy at its source.</div>`;}
function detailHTML(m){const textModel=['Text','Reasoning','Multimodal'].includes(m.kind)&&m.arch!=='Encoder';return `<div class="detail-head"><span>MODEL PROFILE / ${m.live?'LIVE HUB':'CURATED INDEX'}</span><button class="icon-btn" id="close-dialog" aria-label="Close model details">${icon('close')}</button></div><div class="detail-body">${orgIcon(m)}<h2>${esc(m.name)}</h2><p class="detail-org">${esc(m.org)} · ${m.year||'Year not indexed'}${m.live?' · repository year':''}</p><div class="detail-badges">${typePill(m)}<span class="badge">${esc(m.access)}</span><span class="badge">${esc(m.license)}</span></div><p class="detail-description">${esc(m.note||`${m.kind} model. Review the linked model card for intended uses, limitations and deployment requirements.`)}</p><div class="spec-grid">${[['Total parameters',paramLabel(m)],['Active per token',m.active?formatParams(m.active):'Not separately reported'],['Context / input limit',m.ctx?m.ctx.toLocaleString()+' tokens':'Not applicable / indexed'],['Architecture',m.arch],['License',m.license],['Access',m.access]].map(([l,v],i)=>`<div class="spec"><small>${l}</small><strong class="${i>=1?'text-spec':''}">${esc(v)}</strong></div>`).join('')}</div>${m.live?`<p style="font-size:10px;color:#9bab86">Metadata may be incomplete. ${m.downloads!=null?Number(m.downloads).toLocaleString()+' Hub downloads in the reported 30-day window.':''} ${m.likes!=null?Number(m.likes).toLocaleString()+' likes.':''}</p>`:''}<div class="detail-actions"><button class="btn ${state.compare.includes(m.id)?'active':''}" data-compare="${esc(m.id)}">${icon('compare')}${state.compare.includes(m.id)?'Selected for comparison':'Add to comparison'}</button>${saveButton(m)}<button class="btn" id="copy-id">${icon('copy')}Copy ID</button></div><section class="detail-section"><h3>Inference & availability</h3><p>${m.access==='API only'?'Use the publisher’s platform or an authorized cloud provider. This model’s weights are not publicly available.':textModel?'Use a compatible local runtime or a hosted inference provider. Model-specific support, hardware and access restrictions vary.':'Inference requires a task-compatible pipeline. Follow the publisher’s model card for libraries, preprocessing and hardware requirements.'}</p>${m.access!=='API only'?'<button class="btn" id="providers">'+icon('refresh')+'Check live providers</button><div id="provider-results"></div>':''}${m.p?`<div class="notice">Ideal 4-bit weight storage: <strong>${weightMemory(m.p,4).toFixed(1)} GiB</strong>. Excludes runtime, KV cache, activations and extra pipeline components. <button class="text-link" data-estimate="${esc(m.id)}">Explore memory estimates ↗</button></div>`:''}</section><section class="detail-section"><h3>Published benchmarks</h3>${m.bench?.length?m.bench.map(b=>`<div class="detail-stat"><span>${esc(b.name)}<small>${esc(b.protocol)}</small></span><strong>${b.score}%</strong></div>`).join('')+`<a class="text-link" style="margin-top:12px" href="${esc(safeURL(m.benchSource||m.source))}" target="_blank" rel="noopener noreferrer">Evaluation source ↗</a>`:'<p>No verified benchmark values are indexed for this entry. This does not imply poor performance. See the model card for its evaluation results.</p>'}</section><section class="detail-section"><h3>Go to the source</h3><div class="source-list"><a href="${esc(safeURL(m.source))}" target="_blank" rel="noopener noreferrer">Publisher documentation / model card${icon('external')}</a>${m.paramSource?`<a href="${esc(safeURL(m.paramSource))}" target="_blank" rel="noopener noreferrer">Architecture & parameter source${icon('external')}</a>`:''}</div><p style="font-size:9px;margin-top:12px">${m.live?'Retrieved from Hugging Face on demand. Community repository metadata is not independently verified.':'Curated specification snapshot: '+checked+'. Check the source for current terms and availability.'}</p></section></div>`;}
async function openDetail(id){const m=resolve(id);if(!m)return;dialogTrigger=document.activeElement;activeModel=m;$('#detail-content').innerHTML=detailHTML(m);if(!$('#detail-dialog').open)$('#detail-dialog').showModal();$('#detail-dialog').scrollTop=0;$('#close-dialog').focus();if(m.live&&!m.hydrated){try{const d=await fetchJSON('https://huggingface.co/api/models/'+encodeModelId(id));const fresh=normalizeHub(d);Object.assign(m,{...fresh,hydrated:true});const config=await fetchJSON('https://huggingface.co/'+encodeModelId(id)+'/resolve/main/config.json').catch(()=>null);if(config){m.ctx=config.text_config?.max_position_embeddings||config.max_position_embeddings||config.n_positions||m.ctx;m.arch=config.model_type||m.arch;}if(activeModel===m&&$('#detail-dialog').open)$('#detail-content').innerHTML=detailHTML(m);if(state.saved.includes(id)){state.liveCache=state.liveCache.filter(x=>x.id!==id);state.liveCache.push(m);persist();}renderResults();}catch{if(activeModel===m)toast('Full metadata could not load. The model card is available at the source link.');}}}
function closeDetail(){$('#detail-dialog').close();dialogTrigger?.focus?.();}
const encodeModelId=id=>id.split('/').map(encodeURIComponent).join('/');
async function fetchJSON(url){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(url,{signal:controller.signal,credentials:'omit'});if(!r.ok)throw new Error(r.status===429?'The Hub is rate limiting requests. Please try again shortly.':'The source returned HTTP '+r.status+'.');return await r.json();}finally{clearTimeout(timeout);}}
function normalizeHub(d){const id=d.id||d.modelId,tag=d.pipeline_tag||'',kind=({'text-generation':'Text','image-text-to-text':'Multimodal','text-to-image':'Image','image-to-image':'Image','automatic-speech-recognition':'Audio','text-to-speech':'Audio','audio-to-audio':'Audio','text-to-video':'Video','image-to-video':'Video','feature-extraction':'Embedding','sentence-similarity':'Embedding','image-classification':'Vision','object-detection':'Vision','image-segmentation':'Vision','fill-mask':'Text','text-classification':'Text','token-classification':'Text','translation':'Text','summarization':'Text'})[tag]||'Other';const tags=d.tags||[],license=d.cardData?.license||tags.find(t=>t.startsWith('license:'))?.slice(8)||'Not indexed';return {id,name:id.split('/').pop(),org:d.author||id.split('/')[0],kind,p:d.safetensors?.total?d.safetensors.total/1e9:null,ctx:d.config?.max_position_embeddings||d.config?.text_config?.max_position_embeddings||null,year:d.createdAt?new Date(d.createdAt).getUTCFullYear():null,license:Array.isArray(license)?license.join(', '):String(license),access:d.gated?'Gated weights':'Open weights',arch:d.config?.model_type||d.config?.architectures?.[0]||'Not indexed',source:'https://huggingface.co/'+encodeModelId(id),downloads:d.downloads,likes:d.likes,live:true,note:'Public Hub repository. Metadata is provided by the repository and may describe a base model, fine-tune, adapter or quantized variant. Parameter metadata can be absent or represent stored tensors rather than logical parameter counts.'};}
async function loadLive(append=false){const req=++requestCounter;state.liveStatus='loading';renderResults();try{const params=new URLSearchParams({limit:'30',sort:'downloads',direction:'-1',full:'true',config:'true'});if(state.q.trim())params.set('search',state.q.trim());if(kindToTask[state.kind])params.set('filter',kindToTask[state.kind]);const url=append&&state.liveNext?state.liveNext:'https://huggingface.co/api/models?'+params;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);let res;try{res=await fetch(url,{signal:controller.signal,credentials:'omit'});}finally{clearTimeout(timer);}if(!res.ok)throw new Error(res.status===429?'Hugging Face is rate limiting requests. Try again shortly.':'Hugging Face returned HTTP '+res.status+'.');const payload=await res.json();if(!Array.isArray(payload))throw new Error('The source returned an unexpected response.');if(req!==requestCounter)return;const converted=payload.filter(d=>typeof(d.id||d.modelId)==='string').map(normalizeHub);state.live=append?[...state.live,...converted.filter(m=>!state.live.some(x=>x.id===m.id))]:converted;const link=res.headers.get('Link')||'',match=link.match(/<([^>]+)>;\s*rel="next"/);state.liveNext=match&&match[1].startsWith('https://huggingface.co/api/models?')?match[1]:null;state.liveStatus='ready';state.liveTime=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(!append)state.pageNum=1;}catch(e){if(req!==requestCounter)return;state.liveStatus='error';state.liveError=e.name==='AbortError'?'The request timed out.':e.message==='Failed to fetch'?'The browser could not reach Hugging Face. Check your connection or try the source directly.':e.message;}renderResults();}
async function providers(){const m=activeModel,box=$('#provider-results');if(!box||!m)return;box.innerHTML='<div class="loading" style="padding:23px 0"><span class="spinner"></span>Checking provider metadata…</div>';$('#providers').disabled=true;try{const payload=await fetchJSON('https://router.huggingface.co/v1/models/'+encodeModelId(m.id));let record=payload;if(Array.isArray(payload.data))record=payload.data.find(x=>x.id===m.id)||payload.data[0];else if(payload.data)record=payload.data;const entries=record?.providers||[];if(!Array.isArray(entries))throw new Error('Provider metadata has an unsupported format.');if(activeModel!==m)return;const available=entries.filter(p=>p.status==='live');box.innerHTML=available.length?`<div style="overflow-x:auto"><table class="provider-table"><thead><tr><th>PROVIDER</th><th>USD / 1M TOKENS<br>IN / OUT</th><th>TOKENS / S</th><th>TTFT</th></tr></thead><tbody>${available.map(p=>`<tr><td>${esc(p.provider)}${p.context_length?'<small>'+Number(p.context_length).toLocaleString()+' token context</small>':''}</td><td>${p.pricing?.input!=null?'$'+esc(p.pricing.input):'—'} / ${p.pricing?.output!=null?'$'+esc(p.pricing.output):'—'}</td><td>${p.throughput!=null?Number(p.throughput).toFixed(1):'—'}</td><td>${p.first_token_latency_ms!=null?Math.round(p.first_token_latency_ms)+' ms':'—'}</td></tr>`).join('')}</tbody></table></div><p style="font-size:9px;margin-top:10px">Retrieved ${esc(new Date().toLocaleString())}. Performance reflects the latest Hub validation probe; hardware and workload may vary. No universal speed comparison is implied.</p>`:'<div class="notice">No live providers were returned by this router. The model may still be available elsewhere or for local inference.</div>';box.innerHTML+=`<a class="btn" href="${esc(safeURL(m.source))}" target="_blank" rel="noopener noreferrer">View inference options on model card ↗</a>`;}catch(e){if(activeModel===m)box.innerHTML=`<div class="error-note">Live provider metrics could not be retrieved. ${esc(e.name==='AbortError'?'Request timed out.':e.message)}<br><a href="${esc(safeURL(m.source))}" target="_blank" rel="noopener noreferrer">Check inference options on the model card ↗</a></div>`;}finally{if(activeModel===m&&$('#providers'))$('#providers').disabled=false;}}
function exportCSV(){const list=catalogList();if(!list.length){toast('There are no models to export.');return;}const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'").replace(/"/g,'""')+'"';const rows=[['Model','Repository / ID','Developer','Category','Total parameters (billions)','Active parameters (billions)','Context tokens','Year','Access','License','Architecture','Source','Snapshot'],...list.map(m=>[m.name,m.id,m.org,m.kind,m.p,m.active,m.ctx,m.year,m.access,m.license,m.arch,m.source,m.live?new Date().toISOString():checked])];const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='model-atlas-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Exported '+list.length+' models.');}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.page){e.preventDefault();if($('#detail-dialog').open)closeDetail();navigate(b.dataset.page);return;}if(b.dataset.kind){state.kind=b.dataset.kind;state.pageNum=1;if(state.page!=='explore'&&state.page!=='saved')state.page='explore';render();if(state.dataset==='live')loadLive(false);$('#catalog')?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(b.dataset.open){openDetail(b.dataset.open);return;}if(b.dataset.save){toggleSave(b.dataset.save);return;}if(b.dataset.compare){toggleCompare(b.dataset.compare);return;}if(b.dataset.view){state.view=b.dataset.view;renderCatalog();return;}if(b.dataset.dataset){state.dataset=b.dataset.dataset;state.q='';state.org='';state.access='';state.size='';state.pageNum=1;renderCatalog();if(state.dataset==='live')loadLive(false);return;}if(b.dataset.pageNum){state.pageNum=Number(b.dataset.pageNum);renderResults();$('#catalog')?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(b.dataset.benchmark){state.benchmark=b.dataset.benchmark;renderBenchmarks();return;}if(b.dataset.estimate){state.estModel=b.dataset.estimate;closeDetail();navigate('inference');return;}switch(b.id){case 'clear-filters':clearFilters();break;case 'clear-compare':state.compare=[];updateCounts();updateTray();renderResults();break;case 'export':exportCSV();break;case 'side-live':state.dataset='live';state.kind='All models';state.q='';navigate('explore');loadLive(false);$('#catalog').scrollIntoView({behavior:'smooth'});break;case 'retry-live':loadLive(false);break;case 'load-more':loadLive(true);break;case 'menu':{const open=$('#sidebar').classList.toggle('open');b.setAttribute('aria-expanded',String(open));break;}case 'close-dialog':closeDetail();break;case 'providers':providers();break;case 'copy-id':try{await navigator.clipboard.writeText(activeModel.id);toast('Model ID copied.');}catch{toast('Clipboard unavailable. Model ID: '+activeModel.id);}break;}});
document.addEventListener('change',e=>{if(e.target.matches('input[data-compare]'))toggleCompare(e.target.dataset.compare);});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('#detail-dialog').open){e.preventDefault();if(!['explore','saved'].includes(state.page))navigate('explore');$('#search')?.focus();}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');}});
$('#detail-dialog').addEventListener('click',e=>{if(e.target===$('#detail-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDetail();}});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
state.page=['explore','saved','compare','benchmarks','inference','about'].includes(location.hash.slice(1))?location.hash.slice(1):'explore';render();
</script></body></html>
